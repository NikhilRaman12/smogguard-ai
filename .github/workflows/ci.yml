name: SmogGuard AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Provenance Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx aiosqlite pytest pytest-asyncio

      - name: Run Backend Integration & Provenance Test Suite
        env:
          DEMO_MODE: "true"
          SECRET_KEY: "ci-test-secret-key-at-least-32-chars-long"
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          WAQI_API_TOKEN: "demo"
          GEMINI_API_KEY: "ci-mock-key"
        run: |
          python backend/tests/run_tests.py

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
